[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "viraleat-analysis"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "openai==1.78.1",
  "pydantic==2.11.4",
  "python-dotenv==1.2.2",
  "uvicorn==0.34.2",
  "tzdata==2025.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]