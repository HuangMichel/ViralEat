[project]
name = "viraleat-api"
version = "0.1.0"
description = "ViralEat hackathon backend"
readme = "README.md"
authors = [
    { name = "Chloe Petridis", email = "chloe.petridis@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.1",
    "httpx>=0.28.1",
    "openai>=3.46.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.vercel]
entrypoint = "src.viraleat_api.main:app"
